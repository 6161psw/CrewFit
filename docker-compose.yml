services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crewfit
      POSTGRES_PASSWORD: crewfit
      POSTGRES_DB: crewfit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewfit"]
      interval: 5s
      retries: 10
    networks: [crewfit]

  api:
    build: ./CrewFit_BE
    env_file: ./CrewFit_BE/.env
    environment:
      DATABASE_URL: postgresql://crewfit:crewfit@db:5432/crewfit
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [crewfit]

  # FE 개발 서버 (윈도우 Smart App Control 우회). VITE_API_URL 은 브라우저 기준 → localhost:3000
  fe:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./CrewFit_FE:/app
      - fe-node-modules:/app/node_modules
    networks: [crewfit]

volumes:
  db-data:
  uploads:
  fe-node-modules:

networks:
  crewfit:
    driver: bridge
