name: crewfit
description: "CrewFit (크루핏) 학생 앱"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  rxdart: ^0.28.0
  get_it: ^9.0.5
  injectable: ^3.0.0
  dio: ^5.8.0+1
  retrofit: ^4.7.3
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  auto_route: ^11.2.0
  flutter_secure_storage: ^10.3.4
  google_sign_in: ^7.2.0
  socket_io_client: ^3.1.2
  intl: ^0.20.2
  collection: ^1.19.1
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  retrofit_generator: ^10.0.6
  json_serializable: ^6.9.4
  freezed: ^4.0.3
